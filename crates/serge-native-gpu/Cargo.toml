[package]
name = "serge-native-gpu"
description = "GPU renderer of serge's ScenePrimitive (wgpu): one instance buffer, one draw call per frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
camera = ["dep:cc", "dep:objc2", "dep:objc2-metal", "dep:futures-channel"]
native-metal = ["dep:cc", "dep:naga", "dep:objc2", "dep:objc2-metal"]

[build-dependencies]
cc = {version="1", optional=true}
naga = {version="=30.0.2", default-features=false, features=["wgsl-in","msl-out"], optional=true}

[target.'cfg(target_vendor="apple")'.dependencies]
objc2 = {version="=0.6.5",optional=true}
objc2-metal = {version="=0.3.2",default-features=false,features=["std","MTLTexture","MTLDevice"],optional=true}
futures-channel = {workspace=true,optional=true}

[dependencies]
serge-core.workspace = true
serge-native-cpu.workspace = true
serge-native-text.workspace = true
serge-style.workspace = true
wgpu.workspace = true

[target.'cfg(target_vendor="apple")'.dev-dependencies]
core-foundation = "=0.10.1"

[dev-dependencies]
serge-native.workspace = true

[lints]
workspace = true
