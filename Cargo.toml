[workspace]
members = ["crates/serge-style", "crates/serge-core", "crates/serge-macros", "crates/serge", "crates/serge-native-text", "crates/serge-native-layout", "crates/serge-native", "crates/serge-native-cpu", "crates/serge-platform-desktop", "crates/serge-router", "crates/serge-web-dom", "crates/serge-adapter-client", "apps/serge-playground"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
# The highest requirement of the pinned stack and our code: vello_cpu 0.4
# needs 1.89, and the playground links orbic (1.94) (`hyperish/docs`
# `05-development-rules.md` §8).
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hyperish/serge"
authors = ["Hyperish Contributors"]

[workspace.dependencies]
serge = { path = "crates/serge", version = "=0.1.0-alpha.0" }
serge-adapter-client = { path = "crates/serge-adapter-client", version = "=0.1.0-alpha.0" }
serge-core = { path = "crates/serge-core", version = "=0.1.0-alpha.0" }
serge-macros = { path = "crates/serge-macros", version = "=0.1.0-alpha.0" }
serge-native = { path = "crates/serge-native", version = "=0.1.0-alpha.0" }
serge-native-cpu = { path = "crates/serge-native-cpu", version = "=0.1.0-alpha.0" }
serge-native-layout = { path = "crates/serge-native-layout", version = "=0.1.0-alpha.0" }
serge-native-text = { path = "crates/serge-native-text", version = "=0.1.0-alpha.0" }
serge-platform-desktop = { path = "crates/serge-platform-desktop", version = "=0.1.0-alpha.0" }
serge-router = { path = "crates/serge-router", version = "=0.1.0-alpha.0" }
serge-style = { path = "crates/serge-style", version = "=0.1.0-alpha.0" }
serge-web-dev = { path = "crates/serge-web-dev", version = "=0.1.0-alpha.0" }
serge-web-dom = { path = "crates/serge-web-dom", version = "=0.1.0-alpha.0" }

# hyve and orbic, unpublished: sibling paths plus the exact prerelease version
# (`hyperish/docs` `05-development-rules.md` §5).
hyve = { path = "../hyve/crates/hyve", version = "=0.1.0-alpha.0" }
orbic = { path = "../orbic/crates/orbic", version = "=0.1.0-alpha.0", default-features = false }

# Pinned base crates (`docs/02-architecture.md` §3, §7.8 착수 방식).
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "block_layout", "taffy_tree"] }
vello_cpu = { version = "=0.4.0", default-features = false }
parley = { version = "=0.13.0" }
winit = { version = "=0.30.13" }
softbuffer = { version = "=0.4.8" }

# External dependencies (not forked).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = "=0.3.107"
js-sys = "=0.3.107"
wasm-bindgen-test = "=0.3.80"
syn = { version = "2.0.119", features = ["full", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
tokio = { version = "1.54.1", default-features = false }
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http-body-util = "=0.1.5"
http = "=1.5.0"
bytes = "=1.12.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
