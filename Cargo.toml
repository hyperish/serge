[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hyperish/serge"
homepage = "https://github.com/hyperish/serge"
authors = ["Hyperish Contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
