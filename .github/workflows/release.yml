name: Release

on:
  push:
    tags:
      - "v*"
      - "*-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to publish (defaults to serge)"
        required: false
        default: "serge"
        type: string
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serge
    steps:
      - uses: actions/checkout@v4
        with:
          path: serge
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hyperish/hyve
          ref: 3870159a603b2acfe5e18382d83cdca2fe7f4bb5
          path: hyve
      - uses: actions/checkout@v4
        with:
          repository: hyperish/orbic
          ref: 1caa7b43b0a3d234f705e702feee78e656d5185c
          path: orbic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serge
      - name: Verify release scope and versions
        id: target
        shell: python
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]))
          public = {p["name"]: p["version"] for p in metadata["packages"]
                    if p["id"] in metadata["workspace_members"] and
                    (p["publish"] is None or "crates-io" in p["publish"])}
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              name = os.environ["REQUESTED_PACKAGE"] or "serge"
              version = None
          else:
              tag = os.environ["GITHUB_REF_NAME"]
              name, sep, version = tag.rpartition("-v")
              if not sep:
                  if not tag.startswith("v"):
                      raise SystemExit("expected a version tag")
                  name, version = "", tag[1:]
          if name and name not in public:
              raise SystemExit(f"unknown or private crate {name!r}")
          selected = {name: public[name]} if name else public
          if version is not None:
              for crate, actual in selected.items():
                  if actual != version:
                      raise SystemExit(f"{crate} is {actual}, tag requested {version}")
          print("Selected crates:", ", ".join(sorted(selected)))
          # A coordinated release can publish cross-repository dependencies before tagging.
          prepublished = False
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              import io, tarfile, urllib.error, urllib.request
              prepublished = True
              for crate, actual in selected.items():
                  url = f"https://static.crates.io/crates/{crate}/{crate}-{actual}.crate"
                  try:
                      with urllib.request.urlopen(url, timeout=45) as response:
                          archive = response.read()
                  except urllib.error.HTTPError as error:
                      if error.code not in (403, 404):
                          raise
                      prepublished = False
                      break
                  prefix = f"{crate}-{actual}"
                  with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as package:
                      vcs = json.load(package.extractfile(f"{prefix}/.cargo_vcs_info.json"))["git"]
                  if vcs.get("dirty"):
                      raise SystemExit(f"{crate} was published from a dirty checkout")
                  subprocess.run(["git", "merge-base", "--is-ancestor", vcs["sha1"], "HEAD"], check=True)
                  subprocess.run(["git", "diff", "--quiet", vcs["sha1"], "HEAD", "--", ".", ":(exclude).github"], check=True)
              if prepublished:
                  print("Verified the published archives against the release source.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prepublished={str(prepublished).lower()}", file=output)
              print(f"package={name}", file=output)
      - name: Publish selected crates in dependency order
        if: steps.target.outputs.prepublished != 'true'
        shell: bash
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          args=(--workspace)
          if [[ -n "$PACKAGE" ]]; then args=(-p "$PACKAGE"); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          cargo publish --locked "${args[@]}"
