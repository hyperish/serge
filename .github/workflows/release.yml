name: Release

on:
  push:
    tags:
      - "v*"
      - "*-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to publish (defaults to serge)"
        required: false
        default: "serge"
        type: string
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Resolve target package and verify tag version
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PKG="${{ inputs.package }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-v* ]]; then
              PKG="${TAG%-v*}"
              TAG_VER="${TAG##*-v}"
            else
              PKG="serge"
              TAG_VER="${TAG#v}"
            fi
            CRATE_VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='${PKG}'))")
            if [[ "${TAG_VER}" != "${CRATE_VER}" ]]; then
              echo "::error::Tag version (${TAG_VER}) does not match ${PKG} Cargo.toml version (${CRATE_VER})."
              exit 1
            fi
          fi
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          echo "Publishing package: ${PKG}"

      - name: Verify formatting, lints, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          PKG="${{ steps.target.outputs.package }}"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            cargo publish -p "${PKG}" --dry-run
          else
            if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
              echo "::error::CARGO_REGISTRY_TOKEN secret is not configured."
              exit 1
            fi
            cargo publish -p "${PKG}"
          fi
